name: Django CI/CD or Auction API CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:  
  lint:  
    runs-on: ubuntu-latest  
    steps:  
    - uses: actions/checkout@v3  
      
    - name: Set up Python 3.10  
      uses: actions/setup-python@v4  
      with:  
        python-version: '3.10'  
      
    - name: Install dependencies  
      run: |  
        python -m pip install --upgrade pip  
        pip install -r requirements.txt  
        pip install flake8  
      
    - name: Lint with flake8  
      run: |  
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics  

    - name: Run tests
      run: |
        python manage.py test auctions && python manage.py test authentication

    - name: Build Docker image
      run: |
        docker build -t auction_app:latest .

    # Optional: Add steps to push image to registry here if needed 
  
  deploy-dev:  
    needs: build  
    runs-on: ubuntu-latest  
    steps:  
    - name: Deploy to development  
      run: echo "Deploying to development environment"
