name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: auction_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip \ 
        && pip install -r requirements.txt
    
    - name: Run migrations
      env:
        DB_NAME: auction_test
        DB_USER: postgres
        DB_PASSWORD: 1234
        DB_HOST: localhost
        DB_PORT: 5432
        DJANGO_SECRET_KEY: test-secret-key
        DEBUG: "1"
      run: |
        python manage.py makemigrations
        python manage.py migrate
    
    - name: Run tests
      env:
        DB_NAME: auction_test
        DB_USER: postgres
        DB_PASSWORD: 1234
        DB_HOST: localhost
        DB_PORT: 5432
        DJANGO_SECRET_KEY: test-secret-key
        DEBUG: "1"
      run: |
        python manage.py test auctions \ && python mange.py test authentication
        
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: auction-api:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
