name: Django CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: auction_app
  TAG: latest

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env file for CI
      run: |
        echo "DB_NAME=test_db" >> .env
        echo "DB_USER=postgres" >> .env
        echo "DB_PASSWORD=postgres" >> .env
        echo "DB_HOST=localhost" >> .env
        echo "DB_PORT=5432" >> .env
        echo "DEBUG=True" >> .env
        echo "DJANGO_SECRET_KEY=ci-test-secret-key" >> .env

    - name: Run migrations
      run: |
        python manage.py makemigrations
        python manage.py migrate

    - name: Run tests
      run: |
        python manage.py test auctions --verbosity=2
        python manage.py test authentication --verbosity=2

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ vars.DOCKER_USER }}  # e.g., "wuorbhang211"
        password: ${{ secrets.DOCKER_PAT }}  # Your PAT stored as a GitHub secret

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: |
          ${{ vars.DOCKER_USER }}/${{ env.DOCKER_IMAGE }}:${{ env.TAG }}
          ${{ vars.DOCKER_USER }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-dev:
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Set up Docker CLI
      uses: docker/setup-cli-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ vars.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PAT }}

    - name: Deploy to Docker Cloud/Swarm
      run: |
        docker --host ${{ env.DOCKER_HOST }} \
          --tlsverify \
          --tlscacert $DOCKER_CERT_PATH/ca.pem \
          --tlscert $DOCKER_CERT_PATH/cert.pem \
          --tlskey $DOCKER_CERT_PATH/key.pem \
          stack deploy \
          --with-registry-auth \
          -c docker-compose.prod.yml \
          ${{ env.STACK_NAME }}
